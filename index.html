<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Automotive - Gestione Vendite</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827;padding:24px}
.container{width:100%;max-width:900px;text-align:center}
h1{font-size:38px;margin-bottom:10px}
.subtitle{font-size:18px;color:#6b7280;margin-bottom:40px}
.buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:28px}
.big-button{display:flex;align-items:center;justify-content:center;min-height:220px;padding:30px;border-radius:24px;text-decoration:none;font-size:28px;font-weight:bold;color:white;box-shadow:0 12px 28px rgba(0,0,0,.16);transition:transform .15s ease,box-shadow .15s ease}
.big-button:hover{transform:translateY(-4px);box-shadow:0 16px 34px rgba(0,0,0,.22)}
.insert{background:#8FAFC4}
.report{background:#b00020}
.lock{margin-left:10px}
@media(max-width:700px){.buttons{grid-template-columns:1fr}.big-button{min-height:170px;font-size:24px}h1{font-size:30px}}
</style>
</head>
<body>
<div class="container">
<h1>Automotive</h1>
<div class="subtitle">Gestione contratti e report vendite</div>
<div class="buttons">
<a class="big-button insert" href="https://script.google.com/macros/s/AKfycbxu6M-MYP3DOvGGrsq66k1eDFZBXyIGO3MYww9EqnxGUg_wpI4n3dmxweX47MvUf04c7w/exec">Inserimento dati</a>
<a class="big-button report" href="https://script.google.com/macros/s/AKfycbxu6M-MYP3DOvGGrsq66k1eDFZBXyIGO3MYww9EqnxGUg_wpI4n3dmxweX47MvUf04c7w/exec?page=report">Report <span class="lock">🔒</span></a>
</div>
</div>
</body>
</html>
